<!--
===========================================
文件名: login.html
作者: zjy
功能: 登录注册页面 - 用户登录、注册、管理员邀请码注册
===========================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育馆预约系统 - 登录</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-card .card-header {
            background: #fff;
            border-bottom: none;
            padding-top: 30px;
            text-align: center;
        }
        .login-card .card-header h3 {
            color: #333;
            font-weight: bold;
            margin: 0;
        }
        .login-card .card-body {
            padding: 30px 35px 35px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        .toggle-text a {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .toggle-text a.disabled {
            color: #999;
            cursor: not-allowed;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 22px;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-header">
            <h3 id="formTitle">🔐 登录</h3>
        </div>
        <div class="card-body">
            <form id="authForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                </div>
                <div class="mb-4" id="inviteCodeDiv" style="display:none;">
                    <label for="inviteCode" class="form-label">邀请码（管理员选填）</label>
                    <input type="text" class="form-control" id="inviteCode" placeholder="">
                </div>
                <button type="submit" class="btn btn-primary btn-login" id="submitBtn">登录</button>
            </form>
            <div class="toggle-text">
                <span id="toggleText">还没有账号？</span>
                <a id="toggleLink">去注册</a>
            </div>
            <div class="message" id="message"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var API_BASE = "http://192.168.1.35:5000";  // 手机访问时改成你的电脑IP，如 http://192.168.1.105:5000

        var isLogin = true;
        var isTransitioning = false;
        var formTitle = document.getElementById("formTitle");
        var submitBtn = document.getElementById("submitBtn");
        var toggleText = document.getElementById("toggleText");
        var toggleLink = document.getElementById("toggleLink");
        var authForm = document.getElementById("authForm");
        var message = document.getElementById("message");

        toggleLink.addEventListener("click", function() {
            if (isTransitioning) {
                message.textContent = "请稍等...";
                message.style.color = "#999";
                return;
            }

            isLogin = !isLogin;
            if (isLogin) {
                formTitle.textContent = "🔐 登录";
                submitBtn.textContent = "登录";
                toggleText.textContent = "还没有账号？";
                toggleLink.textContent = "去注册";
                document.getElementById("inviteCodeDiv").style.display = "none";
            } else {
                formTitle.textContent = "📝 注册";
                submitBtn.textContent = "注册";
                toggleText.textContent = "已有账号？";
                toggleLink.textContent = "去登录";
                 document.getElementById("inviteCodeDiv").style.display = "block";
            }
            message.textContent = "";
        });

        authForm.addEventListener("submit", function(event) {
            event.preventDefault();

            var username = document.getElementById("username").value.trim();
            var password = document.getElementById("password").value.trim();

            if (!username || !password) {
                message.style.color = "#f5222d";
                message.textContent = "用户名和密码不能为空";
                return;
            }

            var url = isLogin ? API_BASE + "/api/login" : API_BASE + "/api/register";
            var invite_code = document.getElementById("inviteCode").value.trim();
            var body = JSON.stringify({ username: username, password: password, invite_code: invite_code });

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    if (isLogin) {
                        message.style.color = "#52c41a";
                        message.textContent = "登录成功！正在跳转...";
                        if (data.data && data.data.token) {
                            localStorage.setItem("token", data.data.token);
                            localStorage.setItem("user_id", data.data.user_id);
                            localStorage.setItem("role", data.data.role);
                        }
                        setTimeout(function() {
                            window.location.href = "courts.html";
                        }, 1000);
                    } else {
                        message.style.color = "#52c41a";
                        message.textContent = "注册成功！请登录";
                        document.getElementById("password").value = "";

                        isTransitioning = true;
                        toggleLink.classList.add("disabled");

                        setTimeout(function() {
                            isLogin = true;
                            formTitle.textContent = "🔐 登录";
                            submitBtn.textContent = "登录";
                            toggleText.textContent = "还没有账号？";
                            toggleLink.textContent = "去注册";
                            message.textContent = "";

                            isTransitioning = false;
                            toggleLink.classList.remove("disabled");
                        }, 1500);
                    }
                } else {
                    message.style.color = "#f5222d";
                    message.textContent = data.msg || "操作失败";
                }
            })
            .catch(function(error) {
                message.style.color = "#f5222d";
                message.textContent = "请求失败：" + error.message;
            });
        });
    </script>
</body>
</html>
