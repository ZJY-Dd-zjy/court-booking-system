作者: zjy
功能: 我的预约页面 - 查看、签到、取消预约
===========================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的预约 - 体育馆预约系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .page-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 2rem;
        }
        .nav-bar {
            text-align: right;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .nav-bar a {
            text-decoration: none;
            margin-left: 1rem;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .status-booking {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .status-used {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-cancelled {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .status-timeout {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .empty-state {
            text-align: center;
            color: #6c757d;
            padding: 3rem;
        }
        .loading-state {
            text-align: center;
            color: #6c757d;
            padding: 2rem;
        }
        .error-state {
            text-align: center;
            color: #dc3545;
            padding: 1.5rem;
            background: #f8d7da;
            border-radius: 0.5rem;
        }
    </style>
    <base target="_blank">
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div class="page-card">
            <!-- 导航栏 -->
            <div class="nav-bar">
                <span id="userText" class="text-muted"></span>
                <a href="courts.html" class="text-primary">场地看板</a>
                <a href="login.html" class="text-danger">退出</a>
            </div>

            <h1 class="text-center mb-4">📋 我的预约</h1>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>场地</th>
                            <th>日期</th>
                            <th>时段</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reservationTableBody">
                        <tr><td colspan="5" class="loading-state">正在加载预约记录...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var API_BASE = "http://192.168.1.35:5000";  // 手机访问时改成你的电脑IP，如 http://192.168.1.105:5000

        var token = localStorage.getItem("token");
        var userId = localStorage.getItem("user_id");
        var userText = document.getElementById("userText");
        var tbody = document.getElementById("reservationTableBody");

        // D20: 未登录直接跳转，不打 alert
        if (!token) {
            window.location.href = "login.html";
        } else {
            userText.textContent = "用户" + userId;
            // 管理员显示后台入口
            var role = localStorage.getItem("role");
            if (role === '管理员') {
                var navBar = document.querySelector('.nav-bar');
                var adminLink = document.createElement('a');
                adminLink.href = 'admin.html';
                adminLink.textContent = '管理员后台';
                adminLink.className = 'text-success fw-bold';
                navBar.insertBefore(adminLink, navBar.children[1]);
            }
        }

        function loadReservations() {
            fetch(API_BASE + "/api/my_reservations?user_id=" + userId)
                .then(function(response) {
                    if (!response.ok) throw new Error("服务器错误：" + response.status);
                    return response.json();
                })
                .then(function(data) {
                    tbody.innerHTML = "";
                    var reservations = data.data || data;

                    if (reservations.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无预约记录</td></tr>';
                        return;
                    }

                    for (var i = 0; i < reservations.length; i++) {
                        var r = reservations[i];

                        var statusClass = "status-booking";
                        if (r.status === "已使用") statusClass = "status-used";
                        else if (r.status === "已取消") statusClass = "status-cancelled";
                        else if (r.status === "已超时") statusClass = "status-timeout";

                        var tr = document.createElement("tr");
                        tr.innerHTML =
                            '<td>' + r.court_name + '<br><small class="text-muted">' + r.court_type + '</small></td>' +
                            '<td>' + r.date + '</td>' +
                            '<td>' + r.start_time + ' ~ ' + r.end_time + '</td>' +
                            '<td><span class="status-badge ' + statusClass + '">' + r.status + '</span></td>' +
                            '<td id="btn-cell-' + r.id + '"></td>';

                        var btnCell = tr.querySelector('#btn-cell-' + r.id);

                        // D15：预约中的记录显示"签到"按钮
                        if (r.status === "预约中") {
                            var checkinBtn = document.createElement("button");
                            checkinBtn.className = "btn btn-success btn-sm me-2";
                            checkinBtn.textContent = "签到";
                            checkinBtn.addEventListener("click", (function(rid) {
                                return function() {
                                    doCheckin(rid);
                                };
                            })(r.id));
                            btnCell.appendChild(checkinBtn);

                            var cancelBtn = document.createElement("button");
                            cancelBtn.className = "btn btn-outline-danger btn-sm";
                            cancelBtn.textContent = "取消";
                            cancelBtn.addEventListener("click", (function(rid) {
                                return function() {
                                    doCancel(rid);
                                };
                            })(r.id));
                            btnCell.appendChild(cancelBtn);
                        }
                        // 已使用的显示"已签到" + 取消按钮
                        else if (r.status === "已使用") {
                            btnCell.innerHTML = '<span class="text-success" style="font-size:0.875rem;">✓ 已签到</span>';
                            var cancelBtn = document.createElement("button");
                            cancelBtn.className = "btn btn-outline-danger btn-sm ms-2";
                            cancelBtn.textContent = "取消";
                            cancelBtn.addEventListener("click", (function(rid) {
                                return function() {
                                    doCancel(rid);
                                };
                            })(r.id));
                            btnCell.appendChild(cancelBtn);
                        }
                        // 已超时显示"已超时"
                        else if (r.status === "已超时") {
                            btnCell.innerHTML = '<span class="text-danger" style="font-size:0.875rem;">⏰ 已超时</span>';
                        }
                        // 其他状态不显示按钮

                        tbody.appendChild(tr);
                    }
                })
                .catch(function(error) {
                    tbody.innerHTML = '<tr><td colspan="5" class="error-state">加载失败：' + error.message + '</td></tr>';
                });
        }

        // D15：签到功能
        function doCheckin(reservationId) {
            if (!confirm("确认签到？签到后场地状态将变为'占用'")) return;

            fetch(API_BASE + "/api/checkin", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    reservation_id: parseInt(reservationId),
                    user_id: parseInt(userId)
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.success) {
                    alert("签到成功！");
                    window.location.reload();
                } else {
                    alert("签到失败：" + result.msg);
                }
            })
            .catch(function(err) {
                alert("请求失败：" + err.message);
            });
        }

        // 取消功能
        function doCancel(reservationId) {
            if (!confirm("确认取消这条预约？")) return;

            fetch(API_BASE + "/api/cancel", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    reservation_id: parseInt(reservationId),
                    user_id: parseInt(userId)
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.success) {
                    alert("已取消预约");
                    window.location.reload();
                } else {
                    alert("取消失败：" + result.msg);
                }
            })
            .catch(function(err) {
                alert("请求失败：" + err.message);
            });
        }

        loadReservations();
    </script>
</body>
</html>
